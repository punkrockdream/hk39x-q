<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>qv07</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#3b3530; --sub:#7a7066; --line:#e4dccd;
  --btn:#efe7d8; --btn-on:#d9cbb2; --accent:#6f8f7f; --accent-ink:#fff; --soft:#f1ebe0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:22px;line-height:1.7;-webkit-text-size-adjust:100%}
#app{min-height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px;min-height:44px}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.iconbtn{border:0;background:var(--btn);color:var(--ink);border-radius:14px;min-width:56px;height:48px;font:inherit;font-size:18px;padding:0 14px;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:32px 28px;box-shadow:0 2px 0 var(--line)}
.blk{font-size:16px;color:var(--sub);margin-bottom:6px;letter-spacing:.05em}
.pre{font-size:19px;color:var(--sub);background:var(--soft);border-radius:16px;padding:12px 16px;margin-bottom:16px}
h1{font-size:30px;line-height:1.55;margin:0 0 24px;font-weight:700;letter-spacing:.02em}
.hint{font-size:17px;color:var(--sub);margin:-12px 0 18px}
.opts{display:grid;gap:14px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.opt{border:2px solid transparent;background:var(--btn);color:var(--ink);border-radius:22px;min-height:84px;padding:14px 18px;
  font:inherit;font-size:24px;text-align:left;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .08s,background .15s}
.opt:active{transform:scale(.98)}
.opt.big{justify-content:center;text-align:center;font-size:30px;min-height:120px}
.opt.on{background:var(--btn-on);border-color:var(--ink)}
.opt .ic{font-size:32px;line-height:1;flex:none}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.face{border:2px solid transparent;background:var(--btn);border-radius:22px;padding:14px 4px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.face .f{font-size:44px;line-height:1.1}
.face .l{font-size:16px;line-height:1.35;text-align:center}
.face.on{background:var(--btn-on);border-color:var(--ink)}
.meter{display:flex;justify-content:space-between;font-size:15px;color:var(--sub);margin-top:6px;padding:0 6px}
.go{margin-top:20px;width:100%;border:0;border-radius:22px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:26px;min-height:76px;cursor:pointer}
.go[disabled]{opacity:.4}
.foot{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.foot button{border:0;background:transparent;color:var(--sub);font:inherit;font-size:19px;padding:10px 18px;border-radius:14px;cursor:pointer;text-decoration:underline;text-underline-offset:5px}
.foot .dk{background:var(--soft);text-decoration:none;color:var(--ink)}
textarea{width:100%;min-height:180px;font:inherit;font-size:22px;border:2px solid var(--line);border-radius:18px;padding:14px;background:#fff;color:var(--ink)}
.msg{text-align:center}
.msg .big{font-size:64px;margin-bottom:8px}
.msg p{font-size:26px;margin:0 0 8px}
.lines{list-style:none;padding:0;margin:0 0 8px}
.lines li{font-size:24px;padding:12px 0;border-bottom:1px dashed var(--line)}
.lines li:last-child{border-bottom:0;font-weight:700}
.qr{display:flex;justify-content:center;margin:12px 0}
.qr svg{width:min(78vw,520px);height:auto;background:#fff;border-radius:12px}
.small{font-size:16px;color:var(--sub);line-height:1.6}
.adult{font-family:system-ui,sans-serif}
code{word-break:break-all;font-size:12px;display:block;background:var(--soft);padding:8px;border-radius:8px;max-height:90px;overflow:auto}
@media (max-width:560px){h1{font-size:25px}.opts.two{grid-template-columns:1fr}.face .f{font-size:34px}.face .l{font-size:13px}}
</style>
</head>
<body>
<div id="app"></div>
<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

    Q: Q, QI: QI, BLOCKS: BLOCKS, DOM: DOM, INT_FACES: INT_FACES, INT_LABELS: INT_LABELS, POS_FACES: POS_FACES,
    U0_OPTS: U0_OPTS, U2A_OPTS: U2A_OPTS, U2B_FACES: U2B_FACES, U2B_LABELS: U2B_LABELS, U2C_OPTS: U2C_OPTS, U4A_OPTS: U4A_OPTS,
    optionsOf: optionsOf, visible: visible, shownList: shownList, norm: norm, softValue: softValue,
    score: score, e3Level: e3Level, patterns: patterns, togetherText: togetherText, answerText: answerText, optText: optText,
    makeKeys: makeKeys, encrypt: encrypt, decrypt: decrypt, b64u: b64u, unb64u: unb64u, Y: Y, N: N, has: has
  };
})();
</script>
<script>(function () {
  'use strict';
  var C = CORE, Q = C.Q, QI = C.QI;
  var LS_PUB = 'qv_pub', LS_PAR = 'qv_par', LS_PROG = 'qv_prog';
  var app = document.getElementById('app');

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { } }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // ---------- 設定リンク(#k=公開鍵&p=親用アプリのURL) ----------
  (function readSetup() {
    if (!location.hash || location.hash.indexOf('k=') < 0) return;
    var p = new URLSearchParams(location.hash.slice(1));
    if (p.get('k')) lsSet(LS_PUB, p.get('k'));
    if (p.get('p')) lsSet(LS_PAR, p.get('p'));
    history.replaceState(null, '', location.pathname + location.search);
    window.__justSetup = true;
  })();

  // ---------- 状態 ----------
  var S;
  function fresh() { return { a: {}, u: {}, sk: [], tm: {}, st: Date.now(), stack: [{ k: 'intro' }], seen: {} }; }
  function save() { lsSet(LS_PROG, JSON.stringify(S)); }
  function cur() { return S.stack[S.stack.length - 1]; }
  function push(scr) { S.stack.push(scr); save(); render(); window.scrollTo(0, 0); }
  function back() { if (S.stack.length > 1) { S.stack.pop(); save(); render(); } }

  // ---------- 進み方 ----------
  function nextFrom(idx) {
    for (var i = idx + 1; i < Q.length; i++) {
      var q = Q[i];
      if (!C.visible(q, S.a)) continue;
      if (!S.seen[q.b]) { S.seen[q.b] = 1; return { k: 'block', b: q.b, then: q.id }; }
      return { k: 'q', id: q.id };
    }
    return { k: 'sum' };
  }
  function goNext(id) { push(nextFrom(QI[id].idx)); }
  function unSkip(id) { var i = S.sk.indexOf(id); if (i >= 0) S.sk.splice(i, 1); }
  var t0 = 0;
  function stamp(id) { var d = Math.min(600, Math.round((Date.now() - t0) / 1000)); S.tm[id] = (S.tm[id] || 0) + d; }

  function answer(id, v, keepU) {
    stamp(id);
    S.a[id] = v; unSkip(id);
    if (!keepU) delete S.u[id];
    goNext(id);
  }
  function skip(id) { stamp(id); delete S.a[id]; if (S.sk.indexOf(id) < 0) S.sk.push(id); goNext(id); }
  function dontKnow(id) {
    stamp(id);
    var c = cur();
    if (c.k !== 'q') { // 深掘り中にもう一度「わからない」
      S.u[id] = S.u[id] || {}; S.u[id].again = 1; delete S.a[id]; goNext(id); return;
    }
    delete S.a[id]; S.u[id] = { k: null };
    push({ k: 'u0', id: id });
  }

  // ---------- 読み上げ ----------
  function speak(text) {
    try {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = 0.9;
      speechSynthesis.speak(u);
    } catch (e) { }
  }

  // ---------- 部品 ----------
  function progress() {
    var c = cur(), idx = 0;
    if (c.id && QI[c.id]) idx = QI[c.id].idx;
    else if (c.then) idx = QI[c.then].idx;
    else if (c.k === 'sum' || c.k === 'qr' || c.k === 'end') idx = Q.length;
    return Math.round(idx / Q.length * 100);
  }
  function topBar(showBack) {
    return '<div class="top">' + (showBack ? '<button class="iconbtn" data-act="back" aria-label="もどる">← もどる</button>' : '') +
      '<div class="bar"><i style="width:' + progress() + '%"></i></div>' +
      '<button class="iconbtn" data-act="say" aria-label="よみあげ">🔊</button></div>';
  }
  function optBtn(o, on, extra) {
    return '<button class="opt' + (on ? ' on' : '') + (extra || '') + '" data-v=\'' + esc(JSON.stringify(o.v)) + '\'>' +
      (o.i ? '<span class="ic">' + o.i + '</span>' : '') + '<span>' + esc(o.t) + '</span></button>';
  }
  function footer(id, opts) {
    opts = opts || {};
    return '<div class="foot">' + (opts.noDk ? '' : '<button class="dk" data-act="dk">🤔 わからない</button>') +
      '<button data-act="skip">とばす</button></div>';
  }
  function blockName(b) { return (C.BLOCKS.filter(function (x) { return x.k === b; })[0] || {}).name || ''; }

  // 質問の本体(種類ごと)
  function body(q, text, prev, mode) {
    var h = '', t = q.t;
    if (mode === 'multi' && t === 'one') t = 'multi';
    var opts = C.optionsOf(q, S.a);
    if (t === 'yn') {
      h += '<div class="opts two">' + opts.map(function (o) { return optBtn(o, prev === o.v, ' big'); }).join('') + '</div>';
    } else if (t === 'int' || t === 'pint' || t === 'lvl') {
      var faces = t === 'lvl' ? q.faces : (t === 'pint' ? C.POS_FACES : C.INT_FACES);
      var labels = t === 'lvl' ? q.labels : C.INT_LABELS;
      h += '<div class="faces">' + faces.map(function (f, i) {
        return '<button class="face' + (prev === i ? ' on' : '') + '" data-v="' + i + '"><span class="f">' + f + '</span><span class="l">' + esc(labels[i]) + '</span></button>';
      }).join('') + '</div>';
    } else if (t === 'freq') {
      h += '<div class="opts">' + opts.map(function (o) { return optBtn(o, prev === o.v); }).join('') + '</div>';
    } else if (t === 'one') {
      h += '<div class="opts' + (opts.length > 4 ? ' grid' : '') + '">' + opts.map(function (o) { return optBtn(o, prev === o.v); }).join('') + '</div>';
    } else if (t === 'multi') {
      var sel = Array.isArray(prev) ? prev : (prev ? [prev] : []);
      h += '<p class="hint">いくつ えらんでも いいよ。えらんだら 「つぎへ」</p>';
      h += '<div class="opts grid" data-multi="1">' + opts.map(function (o) { return optBtn(o, sel.indexOf(o.v) >= 0); }).join('') + '</div>';
      h += '<button class="go" data-act="multi-done"' + (sel.length ? '' : ' disabled') + '>つぎへ →</button>';
    } else if (t === 'text') {
      h += '<textarea id="txt" maxlength="200" placeholder="ここに かけるよ">' + esc(prev || '') + '</textarea>';
      h += '<button class="go" data-act="text-done">つぎへ →</button>';
    }
    return h;
  }

  // ---------- 画面 ----------
  var sayText = '';
  function render() {
    var c = cur(), h = '';
    t0 = Date.now();
    if (!lsGet(LS_PUB)) return renderNoSetup();

    if (c.k === 'intro') {
      sayText = 'これは、うまく ことばに できない きもちを、ことばに する おてつだいを する プログラムです。じぶんの きもちを しょうじきに えらぶのは、とても ゆうきの いる ことです。';
      h = topBar(false) + '<div class="main"><div class="card">' +
        '<h1>これは、うまく ことばに できない きもちを、ことばに する おてつだいを する プログラムです。</h1>' +
        '<p>じぶんの きもちを しょうじきに えらぶのは、とても ゆうきの いる ことです。この がめんを ひらいて くれた だけで、もう いっぽ すすんで います。ありがとう。</p>' +
        '<ul style="font-size:20px;padding-left:1.2em;color:var(--ink)">' +
        '<li>こたえに せいかいは ありません。どれを えらんでも、まちがいでは ありません。</li>' +
        '<li>「わからない」も たいせつな こたえです。おすと、べつの ききかたで もう いちど ききます。</li>' +
        '<li>こたえたくない しつもんは 「とばす」で とばせます。</li>' +
        '<li>こたえは、おとうさんと おかあさんが よみます。あなたの ことを もっと わかりたくて つくりました。おこる ための ものでは ありません。</li>' +
        '<li>さいごに、あなたの きもちを ぶんしょうに まとめて、いっしょに よみます。</li>' +
        '<li>ぜんぶで 10〜15ふん くらい。とちゅうで やすんでも だいじょうぶ。🔊 を おすと よみあげます。</li></ul>' +
        '<button class="go" data-act="start">はじめる</button></div></div>';
    } else if (c.k === 'resume') {
      sayText = 'まえの つづきから やる? はじめから やる?';
      h = '<div class="main"><div class="card msg"><div class="big">📒</div><p>まえの つづきが あるよ。</p>' +
        '<button class="go" data-act="resume">つづきから</button>' +
        '<div class="foot"><button data-act="restart">はじめから やりなおす</button></div></div></div>';
    } else if (c.k === 'block') {
      var bl = C.BLOCKS.filter(function (x) { return x.k === c.b; })[0];
      sayText = bl.msg;
      h = topBar(true) + '<div class="main"><div class="card msg"><div class="big">' + ({ A: '🌱', B: '🌅', C: '🏫', D: '🏸', E: '💭', F: '🏠', G: '⭐' })[c.b] + '</div>' +
        '<p>' + esc(bl.msg) + '</p><p class="small">' + esc(bl.name) + '</p>' +
        '<button class="go" data-act="block-go">つぎへ →</button></div></div>';
    } else if (c.k === 'q' || c.k === 'u1' || c.k === 'u3' || c.k === 'u4b') {
      var q = QI[c.id];
      var text = q.q, lead = '', mode = null;
      if (c.k === 'u1') { text = q.e; lead = 'ききかたを かえるね。'; }
      if (c.k === 'u3') { mode = 'multi'; lead = 'いくつ えらんでも いいよ。'; }
      if (c.k === 'u4b') { lead = 'わるい ときの ことを おもいだして こたえてね。'; }
      var prev = c.k === 'q' ? S.a[c.id] : undefined;
      var opts = C.optionsOf(q, S.a) || [];
      sayText = (q.pre ? q.pre + '。' : '') + lead + text + '。' + opts.map(function (o) { return o.t; }).join('、');
      h = topBar(true) + '<div class="main"><div class="card">' +
        '<div class="blk">' + esc(blockName(q.b)) + '</div>' +
        (q.pre && c.k === 'q' ? '<div class="pre">' + esc(q.pre) + '</div>' : '') +
        (lead ? '<div class="pre">' + esc(lead) + '</div>' : '') +
        '<h1>' + esc(text) + '</h1>' + body(q, text, prev, mode) + '</div>' +
        footer(c.id, { noDk: q.t === 'text' }) + '</div>';
    } else if (c.k === 'u0') {
      sayText = 'わからないに ちかいのは どれ? ' + C.U0_OPTS.map(function (o) { return o.t; }).join('、');
      h = topBar(true) + '<div class="main"><div class="card"><div class="pre">おしえて くれて ありがとう。</div>' +
        '<h1>「わからない」に ちかいのは どれ?</h1><div class="opts">' + C.U0_OPTS.map(function (o) { return optBtn(o, false); }).join('') + '</div></div>' +
        '<div class="foot"><button data-act="skip">とばす</button></div></div>';
    } else if (c.k === 'u2a') {
      sayText = 'その とき、からだは どんな かんじ? ' + C.U2A_OPTS.map(function (o) { return o.t; }).join('、');
      h = topBar(true) + '<div class="main"><div class="card"><div class="pre">きもちじゃ なくて、からだの かんじで おしえてね。</div>' +
        '<h1>その ことを かんがえると、からだは どんな かんじ?</h1>' +
        '<p class="hint">いくつ えらんでも いいよ。えらんだら 「つぎへ」</p>' +
        '<div class="opts grid" data-multi="1">' + C.U2A_OPTS.map(function (o) { return optBtn(o, false); }).join('') + '</div>' +
        '<button class="go" data-act="u2a-done" disabled>つぎへ →</button></div>' + footer(c.id) + '</div>';
    } else if (c.k === 'u2b') {
      sayText = 'いちばん ちかい かおは どれ?';
      h = topBar(true) + '<div class="main"><div class="card"><h1>いちばん ちかい かおは どれ?</h1><div class="faces">' +
        C.U2B_FACES.map(function (f, i) { return '<button class="face" data-v="' + i + '"><span class="f">' + f + '</span><span class="l">' + C.U2B_LABELS[i] + '</span></button>'; }).join('') +
        '</div></div>' + footer(c.id) + '</div>';
    } else if (c.k === 'u2c') {
      sayText = 'ことばに するなら、ちかいのは どれ? ' + C.U2C_OPTS.map(function (o) { return o.t; }).join('、');
      h = topBar(true) + '<div class="main"><div class="card"><h1>ことばに するなら、ちかいのは どれ?</h1><div class="opts grid">' +
        C.U2C_OPTS.map(function (o) { return optBtn(o, false); }).join('') + '</div></div>' + footer(c.id) + '</div>';
    } else if (c.k === 'u4a') {
      sayText = 'いい ときと わるい とき、どっちが おおい?';
      h = topBar(true) + '<div class="main"><div class="card"><h1>いい ときと わるい とき、どっちが おおい?</h1><div class="opts">' +
        C.U4A_OPTS.map(function (o) { return optBtn(o, false); }).join('') + '</div></div>' + footer(c.id) + '</div>';
    } else if (c.k === 'sum') {
      var lines = C.togetherText(exportData());
      sayText = 'あなたの きもちの まとめ。' + lines.join('');
      h = topBar(true) + '<div class="main"><div class="card"><div class="blk">きもちの まとめ</div>' +
        '<h1>さいごまで こたえて くれて ありがとう。</h1>' +
        '<p class="small" style="font-size:19px">おとうさん・おかあさんと いっしょに よんでね。</p>' +
        '<ul class="lines">' + lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' +
        '<button class="go" data-act="to-qr">おとうさんに わたす</button></div></div>';
    } else if (c.k === 'qr') {
      sayText = '';
      h = '<div class="main adult"><div class="card"><div class="blk">おとうさん用の がめん</div>' +
        '<h1 style="font-size:24px">スマホのカメラでQRコードを読み取ってください</h1><div id="qrbox" class="qr"><p class="small">暗号化しています…</p></div>' +
        '<p class="small">読み取ると親用ページが開き、お父さんのスマホに保存された鍵で答えを読み解きます。この画面だけでは中身は読めません。</p>' +
        '<details><summary class="small">読み取れないとき(文字列でわたす)</summary><code id="code"></code>' +
        '<button class="iconbtn" data-act="copy" style="margin-top:8px">文字列をコピー</button></details>' +
        '<button class="go" data-act="finish">読み取れたので、おわる</button>' +
        '<div class="foot"><button data-act="back">まとめに もどる</button></div></div></div>';
    } else if (c.k === 'end') {
      sayText = 'ありがとう。おしまいです。';
      h = '<div class="main"><div class="card msg"><div class="big">🌷</div><p>ありがとう。おしまいです。</p>' +
        '<p class="small">こたえて くれた ゆうきに、ありがとう。</p></div></div>';
    }
    app.innerHTML = h;
    if (c.k === 'qr') makeQR();
  }

  function renderNoSetup() {
    app.innerHTML = '<div class="main adult"><div class="card"><h1 style="font-size:24px">まだ準備ができていません</h1>' +
      '<p class="small">お父さんへ:親用ページで鍵を作り、表示された「iPad用の設定リンク」をこのiPadで開いてください。</p></div></div>';
  }

  // ---------- 書き出し ----------
  function exportData() {
    var shown = {}; C.shownList(S.a).forEach(function (q) { shown[q.id] = 1; });
    var a = {}, u = {}, tm = {};
    Object.keys(S.a).forEach(function (id) { if (shown[id]) a[id] = S.a[id]; });
    Object.keys(S.u).forEach(function (id) { if (shown[id] && S.u[id].k !== undefined) u[id] = S.u[id]; });
    Object.keys(S.tm).forEach(function (id) { if (shown[id]) tm[id] = S.tm[id]; });
    return { v: 1, t: Date.now(), dur: Math.round((Date.now() - S.st) / 1000), a: a, u: u, sk: S.sk.filter(function (id) { return shown[id]; }), tm: tm };
  }
  var payloadStr = '';
  function makeQR() {
    var box = document.getElementById('qrbox');
    C.encrypt(exportData(), lsGet(LS_PUB)).then(function (s) {
      payloadStr = s;
      var par = lsGet(LS_PAR) || '';
      var url = par ? par + '#d=' + s : s;
      document.getElementById('code').textContent = s;
      try {
        var qr = qrcode(0, 'L'); qr.addData(url, 'Byte'); qr.make();
        box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
      } catch (e) {
        box.innerHTML = '<p class="small">QRコードに入りきりませんでした。下の「文字列でわたす」を使ってください。</p>';
      }
    }).catch(function (e) {
      box.innerHTML = '<p class="small">暗号化できませんでした(' + esc(e.message) + ')。https で開いているか確認してください。</p>';
    });
  }

  // ---------- 操作 ----------
  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('button'); if (!el) return;
    var act = el.getAttribute('data-act'), c = cur();
    if (act === 'say') return speak(sayText);
    if (act === 'back') return back();
    if (act === 'start') return push(nextFrom(-1));
    if (act === 'resume') { S.stack.pop(); save(); return render(); }
    if (act === 'restart') { S = fresh(); save(); return render(); }
    if (act === 'block-go') { S.stack[S.stack.length - 1] = { k: 'q', id: c.then }; save(); return render(); }
    if (act === 'dk') return dontKnow(c.id);
    if (act === 'skip') return skip(c.id);
    if (act === 'to-qr') return push({ k: 'qr' });
    if (act === 'copy') { try { navigator.clipboard.writeText(payloadStr); el.textContent = 'コピーしました'; } catch (e) { } return; }
    if (act === 'finish') { lsDel(LS_PROG); S = fresh(); S.stack = [{ k: 'end' }]; return render(); }

    // 複数選択
    var grid = el.closest('[data-multi]');
    if (grid && el.classList.contains('opt')) {
      el.classList.toggle('on');
      var v = JSON.parse(el.getAttribute('data-v'));
      // 「とくに ない」系は単独
      var exclusive = ['none', 'nothing', 'any', 'noreason', 'all'];
      var ons = grid.querySelectorAll('.opt.on');
      if (el.classList.contains('on')) {
        ons.forEach(function (b) {
          var bv = JSON.parse(b.getAttribute('data-v'));
          if (b !== el && (exclusive.indexOf(v) >= 0 || exclusive.indexOf(bv) >= 0)) b.classList.remove('on');
        });
      }
      var go = app.querySelector('.go'); if (go) go.disabled = !grid.querySelector('.opt.on');
      return;
    }
    if (act === 'multi-done' || act === 'u2a-done') {
      var sel = [].map.call(app.querySelectorAll('[data-multi] .opt.on'), function (b) { return JSON.parse(b.getAttribute('data-v')); });
      if (act === 'u2a-done') { S.u[c.id].body = sel; return push({ k: 'u2b', id: c.id }); }
      if (c.k === 'u3' || c.k === 'u1' || c.k === 'u4b') { S.u[c.id].res = 1; return answer(c.id, sel, true); }
      return answer(c.id, sel);
    }
    if (act === 'text-done') {
      var t = (document.getElementById('txt').value || '').trim().slice(0, 200);
      if (t) return answer(c.id, t); return skip(c.id);
    }

    // 1つ選ぶ
    if (el.hasAttribute('data-v')) {
      var val = JSON.parse(el.getAttribute('data-v'));
      if (c.k === 'q') return answer(c.id, val);
      if (c.k === 'u1' || c.k === 'u3' || c.k === 'u4b') { S.u[c.id].res = 1; return answer(c.id, val, true); }
      if (c.k === 'u0') {
        S.u[c.id] = { k: val };
        var q = QI[c.id];
        if (val === 'meaning') return push({ k: 'u1', id: c.id });
        if (val === 'feel') return push({ k: 'u2a', id: c.id });
        if (val === 'choose') {
          if (q.t === 'one') return push({ k: 'u3', id: c.id });
          if (q.t === 'yn') { S.a[c.id] = 0.5; return goNext(c.id); }
          return push({ k: 'u1', id: c.id });
        }
        if (val === 'depends') return push({ k: 'u4a', id: c.id });
        return goNext(c.id); // hard
      }
      if (c.k === 'u2b') {
        S.u[c.id].face = val;
        var sv = C.softValue(QI[c.id], val);
        if (sv !== null) { S.a[c.id] = sv; S.u[c.id].soft = 1; }
        return push({ k: 'u2c', id: c.id });
      }
      if (c.k === 'u2c') { S.u[c.id].word = val; return goNext(c.id); }
      if (c.k === 'u4a') {
        S.u[c.id].mostly = val;
        var qq = QI[c.id];
        if (qq.t === 'multi' || qq.t === 'one' || qq.t === 'text') return goNext(c.id);
        return push({ k: 'u4b', id: c.id });
      }
    }
  });

  // ---------- 起動 ----------
  var saved = lsGet(LS_PROG);
  if (saved) {
    try { S = JSON.parse(saved); } catch (e) { S = fresh(); }
    if (S && S.stack && S.stack.length > 1 && cur().k !== 'end') S.stack.push({ k: 'resume' });
    else S = fresh();
  } else S = fresh();
  if (window.__justSetup) {
    app.innerHTML = '<div class="main adult"><div class="card msg"><div class="big">✅</div><p>設定できました</p>' +
      '<p class="small">このiPadで答えを暗号化できるようになりました。</p><button class="go" id="ok">はじめの画面へ</button></div></div>';
    document.getElementById('ok').onclick = function () { render(); };
  } else render();
})();
</script>
</body>
</html>
