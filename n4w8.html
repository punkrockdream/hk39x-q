<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>qv07-d</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#22231f;--sub:#6b6c66;--line:#e2e0d8;--acc:#3f6e5e;--warn:#b5651d;--crit:#a8322c;--good:#3f7a52;--bar:#c98a4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.7}
main{max-width:820px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:4px 0 16px}
h2{font-size:18px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.sub{color:var(--sub);font-size:14px}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--ink)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea,input{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
code{word-break:break-all;font-size:12px;display:block;background:#f2f1ec;padding:8px;border-radius:8px}
.alert{border-left:6px solid var(--crit);background:#fbefee}
.alert.soon{border-color:var(--warn);background:#fbf3ea}
.alert.watch{border-color:#c9a227;background:#fbf8ea}
.dom{display:grid;grid-template-columns:minmax(150px,230px) 1fr 70px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.track{height:14px;background:#efede6;border-radius:7px;overflow:hidden;position:relative}
.track i{display:block;height:100%;background:var(--bar)}
.track.good i{background:var(--good)}
.track b{position:absolute;top:0;bottom:0;width:1px;background:#00000022}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:#efede6;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600}
.lines li{margin:4px 0}
.chg{font-size:12px;margin-left:6px}
.qr svg{width:240px;height:auto;background:#fff}
#sheet{display:none}
@media print{
  body{background:#fff;font-size:12px}
  main>*:not(#sheet){display:none!important}
  #sheet{display:block!important}
  .card{border:1px solid #999;break-inside:avoid}
}
</style>
</head>
<body>
<main id="app"></main>
<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------

      '<button class="pri" id="gen">鍵をつくる</button></div>' +
      '<div class="card"><h2>鍵をバックアップから戻す</h2><textarea id="restore" rows="3" placeholder="バックアップした文字列を貼り付け"></textarea>' +
      '<div class="row" style="margin-top:8px"><button id="rs">戻す</button></div></div>';
    document.getElementById('gen').onclick = function () {
      C.makeKeys().then(function (k) {
        lsSet(LS_PRIV, JSON.stringify(k.priv)); lsSet('qv_pubcopy', k.pub);
        renderKeyInfo(true);
      }).catch(function (e) { renderSetup('鍵をつくれませんでした:' + e.message + '(httpsで開いているか確認してください)'); });
    };
    document.getElementById('rs').onclick = function () {
      try {
        var o = JSON.parse(atob(document.getElementById('restore').value.trim()));
        lsSet(LS_PRIV, JSON.stringify(o.priv)); lsSet('qv_pubcopy', o.pub); renderKeyInfo(false);
      } catch (e) { renderSetup('文字列が正しくありません'); }
    };
  }
  function renderKeyInfo(isNew) {
    var pub = lsGet('qv_pubcopy');
    var link = kidUrl() + '#k=' + pub + '&p=' + encodeURIComponent(selfUrl());
    var backup = btoa(JSON.stringify({ priv: priv(), pub: pub }));
    app.innerHTML = '<h1>' + (isNew ? '鍵ができました' : '鍵の情報') + '</h1>' +
      '<div class="card"><h2>1. iPadに設定する</h2><p>iPadのカメラでこのQRコードを読み取り、開いたページで「設定できました」と出ればOKです。</p>' +
      '<div class="qr">' + qrSvg(link) + '</div><details><summary class="sub">リンクで送る場合</summary><code>' + esc(link) + '</code></details></div>' +
      '<div class="card"><h2>2. 鍵のバックアップ(大事)</h2><p class="sub">このスマホのブラウザのデータを消すと鍵も消え、過去の答えが読めなくなります。下の文字列をメモアプリなど自分だけが見られる場所に保存してください。<b>娘さんの目に触れる場所には置かないでください。</b></p>' +
      '<code>' + esc(backup) + '</code><div class="row" style="margin-top:8px"><button id="cp">コピー</button></div></div>' +
      '<div class="row"><button class="pri" id="home">結果の画面へ</button></div>';
    document.getElementById('cp').onclick = function () { navigator.clipboard.writeText(backup); this.textContent = 'コピーしました'; };
    document.getElementById('home').onclick = renderHome;
  }

  // ---------- ホーム ----------
  function renderHome(msg) {
    var h = hist();
    app.innerHTML = '<h1>結果</h1>' + (typeof msg === 'string' && msg ? '<div class="card alert">' + esc(msg) + '</div>' : '') +
      '<div class="card"><p>iPadに出たQRコードをこのスマホのカメラで読み取ると、ここに結果が出ます。</p>' +
      '<details><summary class="sub">文字列を貼り付けて読み解く</summary><textarea id="paste" rows="4"></textarea><div class="row" style="margin-top:8px"><button class="pri" id="dec">読み解く</button></div></details></div>' +
      '<div class="card"><h2>これまでの回答</h2>' + (h.length ? '<table>' + h.map(function (d, i) {
        return '<tr><td>' + fmtDate(d.t) + '</td><td><button data-i="' + i + '">開く</button></td></tr>';
      }).reverse().join('') + '</table>' : '<p class="sub">まだありません</p>') + '</div>' +
      '<div class="row"><button id="key">鍵の情報・iPadの設定</button></div>';
    var dec = document.getElementById('dec');
    dec.onclick = function () { openCipher(document.getElementById('paste').value); };
    document.getElementById('key').onclick = function () { renderKeyInfo(false); };
    [].forEach.call(app.querySelectorAll('button[data-i]'), function (b) { b.onclick = function () { renderResult(hist()[+b.getAttribute('data-i')]); }; });
  }

  function openCipher(str) {
    var s = (str || '').trim(); if (s.indexOf('#d=') >= 0) s = s.split('#d=')[1];
    C.decrypt(s, priv()).then(function (data) {
      var h = hist();
      if (!h.some(function (x) { return x.t === data.t; })) { h.push(data); lsSet(LS_HIST, JSON.stringify(h)); }
      renderResult(data);
    }).catch(function () { renderHome('読み解けませんでした。鍵が違うか、文字列が途中で切れています。'); });
  }

  // ---------- 結果 ----------
  function prevOf(data) {
    var h = hist().filter(function (x) { return x.t < data.t; }).sort(function (a, b) { return b.t - a.t; });
    return h[0] || null;
  }
  function domRows(sc, pv) {
    return C.DOM.map(function (d) {
      var r = sc[d.k], s = r.s, good = d.k === 'd9';
      var low = d.k !== 'd8' && r.conf < 0.5;
      var chg = '';
      if (pv && pv[d.k].s !== null && s !== null) {
        var df = s - pv[d.k].s;
        if (Math.abs(df) >= 15) chg = '<span class="chg">' + (df > 0 ? '▲' : '▼') + Math.abs(df) + '</span>';
      }
      return '<div class="dom"><div>' + esc(d.n) + '</div><div class="track' + (good ? ' good' : '') + '"><b style="left:30%"></b><b style="left:60%"></b><i style="width:' + (s || 0) + '%"></i></div>' +
        '<div>' + (s === null || low ? '<span class="tag">材料不足</span>' : s) + chg + '</div></div>';
    }).join('');
  }
  function e3Block(data) {
    var a = data.a, lv = C.e3Level(a);
    if (lv.lv === 'none') return '';
    if (lv.lv === 'unanswered') return '<div class="card alert watch"><h2>E3(消えたい気持ち)</h2><p>この質問には答えていません(「わからない」か「とばす」)。答えなかったこと自体も大事な情報です。エールに相談するときに伝えてください。</p></div>';
    var ids = ['E3', 'E3_1', 'E3_2', 'E3_3', 'E3_4', 'E3_5', 'E3_5a', 'E3_6', 'E3_6a', 'E3_7', 'E3_8'];
    return '<div class="card alert ' + lv.lv + '"><h2>E3:' + esc(lv.t) + '</h2><p>' + esc(lv.act) + '</p><table>' +
      ids.filter(function (id) { return C.has(a, id); }).map(function (id) { return '<tr><td>' + esc(QI[id].q) + '</td><td><b>' + esc(C.answerText(QI[id], a[id], a)) + '</b></td></tr>'; }).join('') +
      '</table><p class="sub">この内容は、娘さんと一緒に読む文章には入っていません。本人を問い詰めず、責めず、まずは一緒にいる時間を増やしてください。</p></div>';
  }
  function voice(data) {
    var a = data.a, rows = [];
    function r(label, id) { if (C.has(a, id)) rows.push('<tr><td>' + label + '</td><td><b>' + esc(C.answerText(QI[id], a[id], a)) + '</b></td></tr>'); }
    r('いちばん大きいこと(本人が選択)', 'H1'); r('まほうで一つ変えるなら', 'G0'); r('あったら助かるもの', 'G1');
    r('得意と苦手が分かるテスト', 'G2'); r('お父さんと話したいことがある', 'F2'); r('お父さんとの話しやすさ', 'F2a');
    r('お母さんと話したいことがある', 'F3'); r('お母さんとの話しやすさ', 'F3a'); r('自由記入', 'G3');
    var words = Object.keys(data.u || {}).filter(function (id) { return data.u[id].word; }).map(function (id) {
      return C.optText({ o: C.U2C_OPTS }, data.u[id].word)[0] + '(' + QI[id].q + ')';
    });
    if (words.length) rows.push('<tr><td>言葉にするなら</td><td>' + esc(words.join(' / ')) + '</td></tr>');
    return rows.join('');
  }
  function dkBlock(data, sc) {
    var k = sc.meta.kinds, names = { meaning: '質問の意味が分からない', feel: '自分の気持ちが分からない', choose: '一つに選べない', depends: 'その時による', hard: '答えにくい・考えたくない' };
    var hardList = Object.keys(data.u || {}).filter(function (id) { return data.u[id].k === 'hard' || data.u[id].again; });
    var kind = Object.keys(names).map(function (x) { return '<tr><td>' + names[x] + '</td><td>' + k[x] + '</td></tr>'; }).join('');
    var details = Object.keys(data.u || {}).map(function (id) {
      var u = data.u[id], q = QI[id], bits = [];
      if (u.k) bits.push(names[u.k] || u.k);
      if (u.again) bits.push('深掘りでも分からない');
      if (u.body) bits.push('体:' + C.optText({ o: C.U2A_OPTS }, u.body).join('、'));
      if (u.face !== undefined) bits.push('顔:' + C.U2B_LABELS[u.face]);
      if (u.mostly) bits.push(C.optText({ o: C.U4A_OPTS }, u.mostly)[0]);
      if (u.res && C.has(data.a, id)) bits.push('→ 答え直し:' + C.answerText(q, data.a[id], data.a));
      return '<tr><td>' + esc(q.q) + '</td><td>' + esc(bits.join(' / ')) + '</td></tr>';
    }).join('');
    return '<p>「わからない」 ' + sc.meta.dk + '回(出題の' + sc.meta.dkRate + '%) ・ とばす ' + sc.meta.skipped.length + '回</p>' +
      '<table>' + kind + '</table>' + (details ? '<h2 style="margin-top:12px">質問ごと</h2><table>' + details + '</table>' : '') +
      (hardList.length ? '<p class="sub">「答えにくい」が出た質問は、本人にとって触れにくい話題かもしれません。急いで聞き出さないでください。</p>' : '');
  }
  function slowBlock(data) {
    var tm = data.tm || {}, ids = Object.keys(tm).sort(function (a, b) { return tm[b] - tm[a]; }).slice(0, 5).filter(function (id) { return tm[id] >= 15; });
    if (!ids.length) return '<p class="sub">特に時間がかかった質問はありません。</p>';
    return '<table>' + ids.map(function (id) { return '<tr><td>' + esc(QI[id].q) + '</td><td>' + tm[id] + '秒</td></tr>'; }).join('') + '</table>';
  }
  function allAnswers(data) {
    var a = data.a;
    return '<table>' + C.shownList(a).map(function (q) {
      var v = C.has(a, q.id) ? C.answerText(q, a[q.id], a) : (data.u && data.u[q.id] ? '(わからない)' : ((data.sk || []).indexOf(q.id) >= 0 ? '(とばす)' : '—'));
      if (data.u && data.u[q.id] && data.u[q.id].soft) v += '(顔で回答)';
      return '<tr><td class="sub">' + q.id + '</td><td>' + esc(q.q) + '</td><td><b>' + esc(v) + '</b></td></tr>';
    }).join('') + '</table>';
  }

  function chatText(data) {
    var sc = C.score(data), a = data.a, lv = C.e3Level(a), pt = C.patterns(a, sc), L = [];
    L.push('【質問アプリの結果】' + fmtDate(data.t) + ' 所要' + Math.round(data.dur / 60) + '分');
    L.push('E3:' + lv.t);
    L.push('領域スコア(0-100、30/60が目安):');
    C.DOM.forEach(function (d) { var r = sc[d.k]; L.push('  ' + d.n + ' ' + (r.s === null ? '材料不足' : r.s) + (d.k !== 'd8' ? '(答えた' + r.n + '/' + r.asked + ')' : '')); });
    L.push('パターン:' + (pt.length ? pt.map(function (p) { return p.n; }).join('、') : 'なし'));
    L.push('わからない:' + sc.meta.dk + '回 ' + JSON.stringify(sc.meta.kinds) + ' / とばす:' + sc.meta.skipped.length + '回');
    L.push('全回答:');
    C.shownList(a).forEach(function (q) {
      var v = C.has(a, q.id) ? C.answerText(q, a[q.id], a) : (data.u && data.u[q.id] ? 'わからない' : '—');
      L.push('  ' + q.id + ' ' + q.q + ' → ' + v + (data.tm && data.tm[q.id] ? '(' + data.tm[q.id] + '秒)' : ''));
    });
    Object.keys(data.u || {}).forEach(function (id) { L.push('  [わからない詳細] ' + id + ' ' + JSON.stringify(data.u[id])); });
    return L.join('\n');
  }

  function sheetHtml(data, sc, pt, lv) {
    return '<h1>エール相談用シート</h1><p>回答日:' + fmtDate(data.t) + ' / 所要時間:' + Math.round(data.dur / 60) + '分 / 答えた質問:' + sc.meta.answered + ' / 「わからない」:' + sc.meta.dk + '</p>' +
      '<p class="sub">中学1年の娘が、家庭で作った質問アプリ(はい/いいえと5段階で答える形式)に回答した結果です。診断ではなく、相談の材料としてお持ちしました。</p>' +
      (lv.lv !== 'none' ? '<div class="card"><h2>E3(消えたい気持ち):' + esc(lv.t) + '</h2>' + e3Block(data).replace(/<div class="card[^"]*">/, '').replace(/<\/div>$/, '') + '</div>' : '') +
      '<div class="card"><h2>領域スコア(0〜100)</h2>' + domRows(sc, null) + '</div>' +
      '<div class="card"><h2>当てはまったパターン</h2>' + (pt.length ? '<ul>' + pt.map(function (p) { return '<li><b>' + esc(p.n) + '</b>:' + esc(p.t) + '</li>'; }).join('') + '</ul>' : '<p>なし</p>') + '</div>' +
      '<div class="card"><h2>本人の声</h2><table>' + voice(data) + '</table></div>' +
      '<div class="card"><h2>「わからない」の内訳</h2>' + dkBlock(data, sc) + '</div>' +
      '<div class="card"><h2>家で観察していること</h2><p>・母親が朝家にいる日は登校し、いない日は休む<br>・平日に休んだ日は部活も休むが、土日の部活には朝早くても一人で行ける<br>・小学3〜4年頃から成績不振。勉強・宿題をしない<br>・何を聞いても「わからない」と答え、気持ちや理由を聞かれると固まる<br>・学校では外面がよく、先生からの指摘はない<br>・父親にも子どもの頃に似た傾向があった可能性</p></div>' +
      '<div class="card"><h2>全回答</h2>' + allAnswers(data) + '</div>';
  }

  function renderResult(data) {
    var sc = C.score(data), a = data.a, lv = C.e3Level(a), pt = C.patterns(a, sc), pv = prevOf(data);
    var pvsc = pv ? C.score(pv) : null;
    var lines = C.togetherText(data);
    var needSheet = lv.lv !== 'none' || (sc.d7.s !== null && sc.d7.s >= 80) || (C.has(a, 'F4a') && a.F4a >= 3);
    app.innerHTML = '<div class="row" style="justify-content:space-between"><h1>' + fmtDate(data.t) + ' の結果</h1><button id="home">戻る</button></div>' +
      '<p class="sub">所要時間 ' + Math.round(data.dur / 60) + '分 ・ 答えた質問 ' + sc.meta.answered + ' ・ これは診断ではありません。</p>' +
      e3Block(data) +
      (needSheet ? '<div class="card alert soon"><p>一緒に読む文章から外した内容があります。エール相談用シートを作って相談に持って行ってください。</p><button class="pri" id="print2">エール相談用シートを印刷・PDF</button></div>' : '') +
      '<div class="card"><h2>本人がいちばん大きいと選んだこと</h2>' + (C.has(a, 'H1') ? '<p style="font-size:20px"><b>' + esc(C.answerText(QI.H1, a.H1, a)) + '</b></p>' : '<p class="sub">(この質問は出なかったか、答えていません)</p>') +
      (C.has(a, 'G0') ? '<p>まほうで一つ変えるなら:<b>' + esc(C.answerText(QI.G0, a.G0)) + '</b></p>' : '') +
      '<p class="sub">点数よりも、本人が自分で選んだこの答えが、真因にいちばん近い手がかりです。</p></div>' +
      '<div class="card"><h2>9つの領域</h2><p class="sub">線は30と60の目安。⑨だけは高いほど良い「支えになる力」。' + (pv ? '前回(' + fmtDate(pv.t) + ')から15以上動いたものに▲▼。' : '') + '</p>' + domRows(sc, pvsc) + '</div>' +
      '<div class="card"><h2>当てはまったパターン</h2>' + (pt.length ? '<ul>' + pt.map(function (p) { return '<li><b>' + esc(p.n) + '</b>:' + esc(p.t) + ' <span class="tag">関連:' + esc(p.h) + '</span></li>'; }).join('') + '</ul>' : '<p class="sub">なし</p>') + '</div>' +
      '<div class="card"><h2>本人の声</h2><table>' + voice(data) + '</table></div>' +
      '<div class="card"><h2>一緒に読んだ文章</h2><ul class="lines">' + lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul></div>' +
      '<div class="card"><h2>「わからない」と「とばす」</h2>' + dkBlock(data, sc) + '</div>' +
      '<div class="card"><h2>時間がかかった質問</h2><p class="sub">迷った質問は、本人にとって引っかかりがある可能性があります。</p>' + slowBlock(data) + '</div>' +
      '<div class="card"><details><summary><b>すべての答え</b></summary>' + allAnswers(data) + '</details></div>' +
      '<div class="card"><h2>書き出す</h2><div class="row"><button class="pri" id="print">エール相談用シートを印刷・PDF</button><button id="chat">Claudeに貼る用のテキストをコピー</button></div></div>' +
      '<section id="sheet">' + sheetHtml(data, sc, pt, lv) + '</section>';
    document.getElementById('home').onclick = renderHome;
    document.getElementById('print').onclick = function () { window.print(); };
    var p2 = document.getElementById('print2'); if (p2) p2.onclick = function () { window.print(); };
    document.getElementById('chat').onclick = function () { navigator.clipboard.writeText(chatText(data)); this.textContent = 'コピーしました'; };
    window.scrollTo(0, 0);
  }

  // ---------- 起動 ----------
  window.addEventListener('hashchange', function () {
    var mm = location.hash.match(/[#&]d=([^&]+)/);
    if (mm && priv()) { history.replaceState(null, '', location.pathname + location.search); openCipher(mm[1]); }
  });
  var m = location.hash.match(/[#&]d=([^&]+)/);
  if (!priv()) { renderSetup(m ? '鍵がこのブラウザにありません。鍵をつくったブラウザで読み取るか、バックアップから戻してください。' : ''); return; }
  if (m) { history.replaceState(null, '', location.pathname + location.search); openCipher(m[1]); }
  else renderHome();
  window.__QV = { chatText: chatText };
})();
</script>
</body>
</html>
